<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brendesha Tynes</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#020208;
  --deep:#07071a;
  --panel:rgba(150,160,255,.045);
  --line:rgba(190,200,255,.14);
  --line-strong:rgba(190,200,255,.3);
  --star:#eceaff;
  --dim:#9c9ab8;
  --faint:#6b6a88;
  --blue:#a9b8ff;
  --warm:#ffe3bd;
  --planet:#e5262f;
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(120% 80% at 75% -10%,#0b0b26 0%,var(--void) 55%) fixed,var(--void);
  color:var(--star);font-family:var(--sans);font-weight:300;font-size:1.0625rem;line-height:1.65;
  min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.02;letter-spacing:-.01em}
p{margin:0 0 1em}

/* nav */
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  padding:1rem clamp(1.25rem,4vw,3.5rem);
  background:linear-gradient(to bottom,rgba(2,2,8,.85),rgba(2,2,8,0));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brand{font-family:var(--serif);font-size:1.5rem;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;position:relative}
nav::-webkit-scrollbar{display:none}
nav a{position:relative;text-decoration:none;color:var(--dim);font-size:.95rem;font-weight:400;
  padding:.55rem .95rem;border-radius:99px;white-space:nowrap;transition:color .25s}
nav a:hover{color:var(--star)}
nav a[aria-current="page"]{color:var(--star)}
nav a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:.1rem;width:5px;height:5px;margin-left:-2.5px;
  border-radius:50%;background:var(--planet);box-shadow:0 0 10px 2px rgba(229,38,47,.55)}

main{position:relative;z-index:1;min-height:100vh}
.page{display:none;padding:7.5rem clamp(1.25rem,4vw,3.5rem) 5rem;max-width:1240px;margin:0 auto}
.page.on{display:block;animation:enter .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}

.pagehead{max-width:46rem;margin-bottom:3.5rem}
.pagehead h2{font-size:clamp(2.8rem,7vw,5.5rem);margin-bottom:1.1rem}
.pagehead p{color:var(--dim);font-size:1.15rem;max-width:36rem}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(2rem,5vw,5rem);align-items:center;min-height:calc(100vh - 12rem)}
.hero h1{font-size:clamp(3.6rem,10.5vw,9rem);margin-bottom:1.6rem}
.hero .lede{font-size:1.25rem;color:var(--dim);max-width:30rem;margin-bottom:2.2rem}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;font:inherit;font-weight:500;font-size:.98rem;cursor:pointer;
  padding:.85rem 1.5rem;border-radius:99px;border:1px solid var(--line-strong);color:var(--star);background:transparent;text-decoration:none;
  transition:background .25s,border-color .25s,color .25s}
.btn:hover{background:rgba(190,200,255,.1);border-color:var(--blue)}
.btn.solid{background:var(--star);color:var(--void);border-color:var(--star)}
.btn.solid:hover{background:#fff}

.portal{position:relative;width:min(100%,430px);aspect-ratio:4/5;margin:0 auto}
.portal .photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:1px solid var(--line-strong);
  box-shadow:0 0 80px rgba(120,130,255,.18),0 0 0 10px rgba(2,2,8,.6)}
.portal img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block;filter:saturate(1.05) contrast(1.03)}
.portal .photo::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(closest-side,transparent 68%,rgba(2,2,12,.55) 100%);box-shadow:inset 0 0 50px rgba(2,2,12,.6)}
.ring{position:absolute;border-radius:50%;border:1px solid var(--line);pointer-events:none}
.ring.r1{inset:-9%;transform:rotate(-14deg);animation:spin 80s linear infinite}
.ring.r2{inset:-20% -14%;transform:rotate(12deg);animation:spin 140s linear infinite reverse;border-color:rgba(190,200,255,.08)}
.ring i{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--warm);box-shadow:0 0 14px 3px rgba(255,227,189,.5)}
.ring.r2 i{background:var(--blue);box-shadow:0 0 12px 3px rgba(169,184,255,.5);width:6px;height:6px;top:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* about lower */
.split{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,6vw,6rem);margin-top:7rem;padding-top:3rem;border-top:1px solid var(--line)}
.split h3{font-size:clamp(2rem,4vw,3rem)}
.bio p{font-size:1.15rem;color:#d3d1e8;max-width:38rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:1.2rem;margin-top:2rem}
.facts div{border-left:1px solid var(--line-strong);padding-left:1rem}
.facts b{display:block;font-family:var(--serif);font-weight:400;font-size:1.7rem;line-height:1.1}
.facts span{color:var(--dim);font-size:.9rem}

.cv{margin-top:6rem}
.cvhead{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:1rem;margin-bottom:2rem}
.cvhead h3{font-size:clamp(2rem,4vw,3rem)}
.cvsec{border-top:1px solid var(--line)}
.cvsec>button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  padding:1.3rem 0;font-family:var(--serif);font-size:1.7rem}
.cvsec>button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cvsec>button span{width:1.6rem;height:1.6rem;border:1px solid var(--line-strong);border-radius:50%;position:relative;flex:none;transition:transform .35s,border-color .3s}
.cvsec>button span::before,.cvsec>button span::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:1px;background:var(--star);transform:translate(-50%,-50%)}
.cvsec>button span::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .35s}
.cvsec.open>button span{transform:rotate(180deg);border-color:var(--blue)}
.cvsec.open>button span::after{transform:translate(-50%,-50%) rotate(0)}
.cvbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.cvsec.open .cvbody{grid-template-rows:1fr}
.cvbody>div{overflow:hidden}
.row{display:grid;grid-template-columns:7.5rem 1fr;gap:1.5rem;padding:.9rem 0}
.row time{color:var(--blue);font-size:.95rem;font-variant-numeric:tabular-nums;padding-top:.15rem}
.row b{font-weight:500;display:block}
.row span{color:var(--dim)}
.cvbody>div>.row:last-child{margin-bottom:1.3rem}

/* research */
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2.5rem}
.chip{font:inherit;font-size:.92rem;cursor:pointer;padding:.5rem 1.1rem;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--dim);transition:all .25s}
.chip:hover{color:var(--star);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{color:var(--void);background:var(--star);border-color:var(--star)}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:5rem 1fr auto;gap:1.5rem;align-items:baseline;padding:1.7rem 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .35s,background .35s}
.item:hover{padding-left:1rem;background:linear-gradient(90deg,rgba(150,160,255,.07),transparent)}
.item time{color:var(--blue);font-variant-numeric:tabular-nums}
.item h3{font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.12;margin-bottom:.35rem}
.item p{color:var(--dim);margin:0;font-size:.98rem}
.tag{font-size:.82rem;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:.2rem .75rem;white-space:nowrap}

/* press */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,5rem)}
.twocol h3{font-size:2.2rem;margin-bottom:1.4rem}
.twocol .item{grid-template-columns:1fr;gap:.3rem;padding:1.3rem 0}
.twocol .item h3{font-size:1.45rem;margin:0}
.twocol .item p{font-size:.92rem}

/* portfolio */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.6rem}
.clip{display:block;text-decoration:none;cursor:pointer}
.thumb{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:var(--deep);transition:border-color .3s,transform .4s cubic-bezier(.2,.7,.2,1)}
.thumb .neb{position:absolute;inset:-20%;filter:blur(28px);opacity:.75;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.clip:hover .thumb{border-color:var(--blue);transform:translateY(-3px)}
.clip:hover .neb{transform:scale(1.15) rotate(6deg)}
.play{position:absolute;left:50%;top:50%;width:3.6rem;height:3.6rem;margin:-1.8rem 0 0 -1.8rem;border-radius:50%;
  border:1px solid rgba(255,255,255,.55);background:rgba(2,2,8,.45);backdrop-filter:blur(4px);display:grid;place-items:center}
.play::before{content:"";margin-left:4px;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.dur{position:absolute;right:.8rem;bottom:.7rem;font-size:.82rem;background:rgba(2,2,8,.7);padding:.1rem .55rem;border-radius:99px}
.clip h3{font-size:1.55rem;margin:1rem 0 .2rem;line-height:1.12}
.clip p{color:var(--dim);font-size:.95rem;margin:0}

/* wellness */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.4rem;margin-bottom:5rem}
.card{position:relative;padding:2rem;border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden}
.card::before{content:"";position:absolute;width:14rem;height:14rem;right:-5rem;top:-5rem;border-radius:50%;background:radial-gradient(closest-side,var(--c,rgba(169,184,255,.22)),transparent);pointer-events:none}
.card h3{font-size:1.9rem;margin-bottom:.7rem}
.card p{color:var(--dim);margin:0}

/* bookings */
.book{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,6vw,6rem)}
.topics{list-style:none;padding:0;margin:0}
.topics li{padding:1.3rem 0;border-top:1px solid var(--line)}
.topics li:last-child{border-bottom:1px solid var(--line)}
.topics b{font-family:var(--serif);font-weight:400;font-size:1.6rem;display:block;line-height:1.15;margin-bottom:.2rem}
.topics span{color:var(--dim);font-size:.96rem}
form{display:grid;gap:1.2rem}
label{display:grid;gap:.4rem;font-size:.92rem;color:var(--dim)}
input,select,textarea{font:inherit;color:var(--star);background:rgba(150,160,255,.05);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;width:100%;transition:border-color .25s,background .25s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:rgba(150,160,255,.09)}
select option{background:#0a0a1c}
textarea{min-height:8rem;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.note{font-size:.88rem;color:var(--faint);margin:0}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:2rem clamp(1.25rem,4vw,3.5rem) calc(2rem + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;color:var(--faint);font-size:.9rem}
footer nav a{padding:0 .8rem 0 0;color:var(--faint)}

@media (max-width:860px){
  header{flex-direction:column;align-items:flex-start;gap:.2rem;padding-bottom:.4rem}
  nav{max-width:100%;margin-left:-.95rem}
  .page{padding-top:8.5rem}
  .hero{grid-template-columns:1fr;min-height:0}
  .portal{order:-1;width:min(78%,340px)}
  .split,.twocol,.book{grid-template-columns:1fr}
  .item{grid-template-columns:3.6rem 1fr}
  .item .tag{display:none}
  .row{grid-template-columns:5.5rem 1fr;gap:1rem}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAGES=[["about","About me"],["research","Research"],["press","Press"],["wellness","Wellness"],["bookings","Bookings"],["portfolio","Portfolio"]];

$("#nav").innerHTML=PAGES.map(([id,l])=>`<a href="#${id}" data-p="${id}">${l}</a>`).join("");
$("#fnav").innerHTML=PAGES.map(([id,l])=>`<a href="#${id}">${l}</a>`).join("");
$("#yr").textContent=new Date().getFullYear();
document.querySelectorAll("[data-k]").forEach(e=>e.textContent=DATA[e.dataset.k]);

/* about */
$("#bio").innerHTML=DATA.bio.map(p=>`<p>${esc(p)}</p>`).join("");
$("#facts").innerHTML=DATA.facts.map(([n,l])=>`<div><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");
$("#cvlist").innerHTML=DATA.cv.map((s,i)=>`
  <div class="cvsec${i===0?" open":""}">
    <button type="button" aria-expanded="${i===0}">${esc(s.title)}<span></span></button>
    <div class="cvbody"><div>${s.rows.map(r=>`<div class="row"><time>${esc(r[0])}</time><div><b>${esc(r[1])}</b><span>${esc(r[2])}</span></div></div>`).join("")}</div></div>
  </div>`).join("");
document.querySelectorAll(".cvsec>button").forEach(b=>b.onclick=()=>{
  const s=b.parentElement;s.classList.toggle("open");b.setAttribute("aria-expanded",s.classList.contains("open"));syncAll();});
const toggleAll=$("#toggleAll");
function syncAll(){const all=[...document.querySelectorAll(".cvsec")];toggleAll.textContent=all.every(s=>s.classList.contains("open"))?"Collapse all":"Expand all";}
toggleAll.onclick=()=>{const all=[...document.querySelectorAll(".cvsec")];const open=!all.every(s=>s.classList.contains("open"));
  all.forEach(s=>{s.classList.toggle("open",open);s.firstElementChild.setAttribute("aria-expanded",open)});syncAll();};
syncAll();
if(DATA.cvUrl){const a=$("#cvdl");a.href=DATA.cvUrl;a.hidden=false;}

/* research */
let theme="All";
function drawResearch(){
  $("#chips").innerHTML=["All",...DATA.themes].map(t=>`<button class="chip" type="button" aria-pressed="${t===theme}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{theme=c.dataset.t;drawResearch();});
  $("#rlist").innerHTML=DATA.research.filter(r=>theme==="All"||r.theme===theme).map(r=>
   `<a class="item" href="${esc(r.url)}" target="_blank" rel="noopener"><time>${esc(r.year)}</time><div><h3>${esc(r.title)}</h3><p>${esc(r.meta)}</p></div><span class="tag">${esc(r.theme)}</span></a>`).join("");
}
drawResearch();

$("#bform").addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target);

/* portfolio */
$("#clips").innerHTML=DATA.clips.map(c=>{
  const [a,b]=c.h;
  const bg=`background:radial-gradient(40% 55% at 30% 35%,hsla(${a},80%,55%,.85),transparent 70%),radial-gradient(45% 50% at 75% 70%,hsla(${b},75%,50%,.7),transparent 70%)`;
  const tag=c.url?`a href="${esc(c.url)}" target="_blank" rel="noopener"`:`a href="#portfolio"`;
  return `<${tag} class="clip"><div class="thumb"><div class="neb" style="${bg}"></div><div class="play"></div><span class="dur">${esc(c.dur)}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.event)}</p></a>`;}).join("");

/* router */
function route(){
  let id=(location.hash||"#about").slice(1);
  if(!PAGES.some(p=>p[0]===id))id="about";
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));
  document.querySelectorAll("#nav a").forEach(a=>{a.dataset.p===id?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  const cur=$(`#nav a[data-p="${id}"]`);cur&&cur.scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo({top:0,behavior:"instant"});
  document.title=(id==="about"?"":PAGES.find(p=>p[0]===id)[1]+" | ")+"Brendesha Tynes";
}
addEventListener("hashchange",route);route();

/* starfield */
(function(){
  const cv=$("#stars"),ctx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,dpr,stars=[],mx=0,my=0,tx=0,ty=0;
  const tints=["236,234,255","169,184,255","255,227,189","255,255,255"];
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/5500);
    stars=Array.from({length:n},()=>{const z=Math.random();return{
      x:Math.random()*W,y:Math.random()*H,z,r:.25+z*1.05,
      a:.12+z*.5,t:Math.random()*6.28,s:.4+Math.random()*1.2,
      c:tints[Math.random()<.72?0:1+Math.floor(Math.random()*3)]};});
  }
  function draw(now){
    ctx.clearRect(0,0,W,H);
    mx+=(tx-mx)*.04;my+=(ty-my)*.04;
    const t=now/1000;
    for(const s of stars){
      const tw=reduce?1:.65+.35*Math.sin(t*s.s+s.t);
      let x=s.x-mx*s.z*18,y=s.y-my*s.z*18;
      if(!reduce)y=(y-t*s.z*1.2+H*4)%H;
      ctx.beginPath();ctx.arc(x,y,s.r,0,6.283);
      ctx.fillStyle=`rgba(${s.c},${(s.a*tw).toFixed(3)})`;ctx.fill();
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  addEventListener("resize",()=>{size();if(reduce)draw(0)});
  addEventListener("pointermove",e=>{tx=e.clientX/W-.5;ty=e.clientY/H-.5},{passive:true});
  size();requestAnimationFrame(draw);
})();
</script>
